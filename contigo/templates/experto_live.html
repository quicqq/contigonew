<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContiGO — Panel en vivo (Feria)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #5b4fe3; --green: #16a34a; --orange: #f97316;
    --red: #dc2626; --bg: #0d1117; --card: #161b22;
    --border: #30363d; --text: #e6edf3; --muted: #7d8590;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; min-height: 100vh; }

  /* TOPBAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; background: var(--card); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg,var(--primary),#8b7ff0); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 14px; }
  .brand-name { font-family: "Sora", sans-serif; font-weight: 700; font-size: 18px; }
  .brand-name span { color: #8b7ff0; }
  .live-pill { display: flex; align-items: center; gap: 6px; background: rgba(22,163,74,0.15); border: 1px solid rgba(22,163,74,0.4); color: var(--green); font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
  .stats { display: flex; gap: 20px; }
  .stat { text-align: center; }
  .stat-n { font-family: "Sora", sans-serif; font-size: 22px; font-weight: 800; }
  .stat-l { font-size: 11px; color: var(--muted); margin-top: -2px; }

  /* LAYOUT */
  .main { display: grid; grid-template-columns: 1fr 340px; gap: 0; height: calc(100vh - 65px); }

  /* FEED */
  .feed { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .feed-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .feed-header h2 { font-family: "Sora", sans-serif; font-size: 16px; color: var(--muted); }
  .filter-row { display: flex; gap: 8px; }
  .filter-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .filter-btn.active { border-color: var(--primary); color: #8b7ff0; }

  /* TARJETA DE SOLICITUD */
  .solicitud-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; transition: border-color .2s;
    animation: slideIn .3s ease-out;
  }
  @keyframes slideIn { from{transform:translateY(-8px);opacity:0} to{transform:translateY(0);opacity:1} }
  .solicitud-card.nueva   { border-left: 3px solid var(--red); }
  .solicitud-card.atendiendo { border-left: 3px solid var(--orange); }
  .solicitud-card.completada { border-left: 3px solid var(--green); opacity: .6; }

  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .card-name { font-weight: 600; font-size: 14px; }
  .card-meta { font-size: 12px; color: var(--muted); }
  .card-tipo { display: inline-block; font-size: 11px; background: rgba(91,79,227,0.2); color: #a5b4fc; padding: 2px 8px; border-radius: 5px; margin-bottom: 8px; }
  .card-desc { font-size: 13.5px; color: var(--text); line-height: 1.5; margin-bottom: 12px; }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-atender  { background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.4); color: var(--orange); padding: 7px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-completar{ background: rgba(22,163,74,0.15); border: 1px solid rgba(22,163,74,0.4); color: var(--green); padding: 7px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-nota     { background: rgba(91,79,227,0.12); border: 1px solid rgba(91,79,227,0.3); color: #a5b4fc; padding: 7px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .status-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; margin-left: auto; }
  .pill-nueva      { background: rgba(220,38,38,.15); color: var(--red); }
  .pill-atendiendo { background: rgba(249,115,22,.15); color: var(--orange); }
  .pill-completada { background: rgba(22,163,74,.15); color: var(--green); }
  .time-ago { font-size: 11px; color: var(--muted); margin-left: auto; }

  /* PANEL LATERAL */
  .side-panel { border-left: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; overflow: hidden; }
  .side-section { padding: 18px; border-bottom: 1px solid var(--border); }
  .side-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }

  /* NOTA RÁPIDA */
  .nota-input { width: 100%; background: #0d1117; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px; font-size: 13px; font-family: inherit; resize: none; min-height: 80px; }
  .nota-input:focus { outline: none; border-color: var(--primary); }

  /* RESUMEN VISUAL */
  .donut-wrap { display: flex; align-items: center; gap: 16px; }
  .legend { display: flex; flex-direction: column; gap: 6px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty svg { opacity: .3; margin-bottom: 12px; }

  /* NOTIFICATION TOAST */
  #newToast { position: fixed; top: 80px; right: 24px; background: var(--green); color: white; padding: 12px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600; opacity: 0; transform: translateY(-10px); transition: all .3s; pointer-events: none; z-index: 100; }
  #newToast.show { opacity: 1; transform: translateY(0); }

  /* RESPONSIVE */
  @media(max-width:800px) { .main{grid-template-columns:1fr;} .side-panel{display:none;} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">CG</div>
    <div>
      <div class="brand-name">Conti<span>GO</span></div>
      <div style="font-size:11px;color:var(--muted);">Panel del experto — Feria</div>
    </div>
  </div>

  <div class="live-pill">
    <span class="live-dot"></span>
    EN VIVO — actualiza cada 3 seg
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-n" id="cntTotal" style="color:#e6edf3;">0</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" id="cntNueva" style="color:var(--red);">0</div><div class="stat-l">Nuevas</div></div>
    <div class="stat"><div class="stat-n" id="cntAtendiendo" style="color:var(--orange);">0</div><div class="stat-l">En atención</div></div>
    <div class="stat"><div class="stat-n" id="cntCompletada" style="color:var(--green);">0</div><div class="stat-l">Completadas</div></div>
  </div>

  <div>
    <button onclick="location.href='/'" style="background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;">← Volver</button>
  </div>
</header>

<div class="main">

  <!-- FEED DE SOLICITUDES -->
  <div class="feed" id="feed">
    <div class="feed-header">
      <h2>Solicitudes recibidas</h2>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('todas',this)">Todas</button>
        <button class="filter-btn" onclick="setFilter('nueva',this)">🔴 Nuevas</button>
        <button class="filter-btn" onclick="setFilter('atendiendo',this)">🟡 En atención</button>
        <button class="filter-btn" onclick="setFilter('completada',this)">🟢 Completadas</button>
      </div>
    </div>
    <div id="solicitudesList"></div>
  </div>

  <!-- PANEL LATERAL -->
  <aside class="side-panel">
    <div class="side-section">
      <div class="side-title">Nota rápida al visitante</div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">Selecciona una solicitud y agrega tu respuesta aquí.</div>
      <textarea class="nota-input" id="notaTexto" placeholder="Ej: Necesitas traer tu cédula original y una foto tamaño carné..."></textarea>
      <button onclick="enviarNota()" style="width:100%;margin-top:8px;background:var(--primary);color:white;border:none;padding:9px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">
        Enviar nota
      </button>
    </div>

    <div class="side-section" style="flex:1;overflow-y:auto;">
      <div class="side-title">Resumen de la feria</div>
      <canvas id="donutChart" width="100" height="100"></canvas>
      <div class="legend" id="donutLegend" style="margin-top:12px;"></div>
    </div>

    <div class="side-section">
      <div class="side-title">Tipos más solicitados</div>
      <div id="topTipos" style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;"></div>
    </div>
  </aside>

</div>

<div id="newToast">🔔 ¡Nueva solicitud recibida!</div>

<script>
// ============================================================
// Estado
// ============================================================
let allSolicitudes = [];
let filtro = "todas";
let selectedId = null;
let lastCount = 0;

const AVATAR_COLORS = ["#5b4fe3","#ec4899","#16a34a","#f97316","#0ea5e9","#a21caf"];
function avatarColor(name) {
  let h = 0; for (let c of name) h = (h * 31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[h];
}
function initials(name) {
  return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}
function timeAgo(isoStr) {
  const s = Math.floor((Date.now() - new Date(isoStr + "Z").getTime()) / 1000);
  if (s < 60) return "hace " + s + "s";
  if (s < 3600) return "hace " + Math.floor(s/60) + "min";
  return "hace " + Math.floor(s/3600) + "h";
}

// ============================================================
// POLLING — llama al servidor cada 3 segundos
// ============================================================
async function fetchSolicitudes() {
  try {
    const res = await fetch("/api/solicitudes/live");
    const data = await res.json();

    // Detectar solicitudes nuevas para la notificación
    const nuevas = data.filter(s => s.estado === "nueva");
    if (nuevas.length > lastCount && lastCount > 0) {
      showNewToast();
      playBeep();
    }
    lastCount = nuevas.length;

    allSolicitudes = data;
    renderFeed();
    updateStats();
    updateDonut();
    updateTopTipos();
  } catch(e) {
    console.error("Error polling:", e);
  }
}

// ============================================================
// RENDER
// ============================================================
function renderFeed() {
  const list = document.getElementById("solicitudesList");
  const filtered = filtro === "todas" ? allSolicitudes
    : allSolicitudes.filter(s => s.estado === filtro);

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      <div>${filtro === "todas" ? "Esperando solicitudes..." : "Sin solicitudes en este estado."}</div>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(s => {
    const color = avatarColor(s.nombre);
    const ini   = initials(s.nombre);
    const pill  = `<span class="status-pill pill-${s.estado}">${
      s.estado === "nueva" ? "🔴 Nueva" : s.estado === "atendiendo" ? "🟡 Atendiendo" : "🟢 Completada"
    }</span>`;
    const selStyle = selectedId === s.id ? "border-color:var(--primary);" : "";
    return `
    <div class="solicitud-card ${s.estado}" style="${selStyle}" onclick="selectCard(${s.id})">
      <div class="card-head">
        <div class="avatar" style="background:${color};">${ini}</div>
        <div>
          <div class="card-name">${s.nombre}</div>
          <div class="card-meta">${s.correo || "Sin correo"}</div>
        </div>
        ${pill}
        <span class="time-ago">${timeAgo(s.created_at)}</span>
      </div>
      <div class="card-tipo">${s.tipo}</div>
      <div class="card-desc">${s.descripcion}</div>
      ${s.nota_experto ? `<div style="background:rgba(91,79,227,.12);border-radius:7px;padding:8px 10px;font-size:12.5px;color:#a5b4fc;margin-bottom:10px;">💬 Tu nota: ${s.nota_experto}</div>` : ""}
      <div class="card-actions">
        ${s.estado === "nueva" ? `<button class="btn-atender" onclick="updateEstado(event,${s.id},'atendiendo')">🟡 Atender</button>` : ""}
        ${s.estado !== "completada" ? `<button class="btn-completar" onclick="updateEstado(event,${s.id},'completada')">🟢 Completar</button>` : ""}
        <button class="btn-nota" onclick="selectCard(${s.id})">💬 Responder</button>
      </div>
    </div>`;
  }).join("");
}

function selectCard(id) {
  selectedId = id;
  renderFeed();
  document.getElementById("notaTexto").focus();
}

function setFilter(f, btn) {
  filtro = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderFeed();
}

// ============================================================
// ACCIONES DEL EXPERTO
// ============================================================
async function updateEstado(e, id, estado) {
  e.stopPropagation();
  await fetch(`/api/solicitud/${id}/estado`, {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ estado })
  });
  fetchSolicitudes();
}

async function enviarNota() {
  if (!selectedId) { showToastMsg("Selecciona una solicitud primero"); return; }
  const nota = document.getElementById("notaTexto").value.trim();
  if (!nota) { showToastMsg("Escribe una nota antes de enviar"); return; }

  await fetch(`/api/solicitud/${selectedId}/estado`, {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ estado: "atendiendo", nota })
  });
  document.getElementById("notaTexto").value = "";
  selectedId = null;
  fetchSolicitudes();
  showToastMsg("✅ Nota enviada");
}

// ============================================================
// STATS + GRÁFICO
// ============================================================
function updateStats() {
  document.getElementById("cntTotal").textContent = allSolicitudes.length;
  document.getElementById("cntNueva").textContent = allSolicitudes.filter(s=>s.estado==="nueva").length;
  document.getElementById("cntAtendiendo").textContent = allSolicitudes.filter(s=>s.estado==="atendiendo").length;
  document.getElementById("cntCompletada").textContent = allSolicitudes.filter(s=>s.estado==="completada").length;
}

function updateDonut() {
  const cv = document.getElementById("donutChart");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const n = allSolicitudes.filter(s=>s.estado==="nueva").length;
  const a = allSolicitudes.filter(s=>s.estado==="atendiendo").length;
  const c = allSolicitudes.filter(s=>s.estado==="completada").length;
  const total = n + a + c || 1;

  const segments = [
    { v: n, color: "#dc2626" },
    { v: a, color: "#f97316" },
    { v: c, color: "#16a34a" },
  ];

  ctx.clearRect(0, 0, 100, 100);
  let start = -Math.PI / 2;
  segments.forEach(seg => {
    const angle = (seg.v / total) * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(50, 50);
    ctx.arc(50, 50, 44, start, start + angle);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    start += angle;
  });
  // agujero del centro
  ctx.beginPath();
  ctx.arc(50, 50, 28, 0, 2 * Math.PI);
  ctx.fillStyle = "#161b22";
  ctx.fill();
  // número en el centro
  ctx.fillStyle = "#e6edf3";
  ctx.font = "bold 18px Sora, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(total, 50, 50);

  document.getElementById("donutLegend").innerHTML = [
    ["🔴 Nuevas", n, "#dc2626"],
    ["🟡 En atención", a, "#f97316"],
    ["🟢 Completadas", c, "#16a34a"],
  ].map(([l,v,col]) => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${col};"></div>
      <span>${l}</span>
      <span style="margin-left:auto;font-weight:700;">${v}</span>
    </div>`).join("");
}

function updateTopTipos() {
  const freq = {};
  allSolicitudes.forEach(s => { freq[s.tipo] = (freq[s.tipo]||0)+1; });
  const sorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const max = sorted[0]?.[1] || 1;
  document.getElementById("topTipos").innerHTML = sorted.map(([tipo,n]) => `
    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
        <span>${tipo}</span><span style="font-weight:700;color:var(--primary);">${n}</span>
      </div>
      <div style="height:5px;background:#30363d;border-radius:3px;">
        <div style="height:5px;background:var(--primary);border-radius:3px;width:${Math.round(n/max*100)}%;"></div>
      </div>
    </div>
  `).join("");
}

// ============================================================
// NOTIFICACIONES
// ============================================================
function showNewToast() {
  const t = document.getElementById("newToast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function showToastMsg(msg) {
  const t = document.getElementById("newToast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => { t.classList.remove("show"); t.textContent = "🔔 ¡Nueva solicitud recibida!"; }, 2500);
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

// ============================================================
// ARRANQUE — primer fetch inmediato, luego cada 3 segundos
// ============================================================
fetchSolicitudes();
setInterval(fetchSolicitudes, 3000);
</script>
</body>
</html>
