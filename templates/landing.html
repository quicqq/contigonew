<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ContiGO — Hacemos tus trámites más simples, juntos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
</head>
<body>
<div class="land">
  <div class="land-bg">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="land-mesh"></div>
  </div>

  <div class="land-card">
    <div class="land-logo">
      <svg width="46" height="30" viewBox="0 0 92 60">
        <circle cx="24" cy="13" r="8.5" fill="#1e3a8a"/>
        <circle cx="50" cy="13" r="8.5" fill="#3b82f6"/>
        <path d="M13 38c0-8.5 6.5-15 15-15s11.5 7.5 16 7.5 8.5-7.5 15-7.5 15 6.5 15 15-6.5 15-15 15-11.5-7.5-16-7.5-8.5 7.5-15 7.5-15-6.5-15-15z"
              fill="none" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="land-title">Conti<span>GO</span></div>
    <p class="land-tag">Hacemos tus trámites más simples, juntos.</p>

    <div class="land-btns">
      <button class="lbtn lbtn-1" data-track="click_crear_cuenta" onclick="authChoice('register')">Crear cuenta gratis</button>
      <button class="lbtn lbtn-2" data-track="click_iniciar_sesion" onclick="authChoice('login')">Ya tengo cuenta</button>
    </div>

    <div class="land-feats">
      <div>✓ Profesionales verificados</div>
      <div>🕐 Respuesta el mismo día</div>
      <div>🔒 Documentos protegidos</div>
      <div>🤝 Acompañamiento total</div>
    </div>
  </div>
</div>

<div class="overlay" id="ov" onclick="if(event.target===this)closeM()"><div class="modal" id="md"></div></div>
<div class="toast" id="tst"></div>

<script src="{{ url_for('static',filename='js/core.js') }}"></script>
<script src="{{ url_for('static',filename='js/auth.js') }}"></script>
<script>
// Parallax suave de los orbes
(function(){
  const orbs=document.querySelectorAll(".orb");let tx=0,ty=0,cx=0,cy=0;
  addEventListener("mousemove",e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;});
  (function a(){cx+=(tx-cx)*.045;cy+=(ty-cy)*.045;
    orbs.forEach((o,i)=>{const d=(i+1)*14;o.style.transform=`translate(${cx*d}px,${cy*d}px)`;});
    requestAnimationFrame(a);})();
})();
</script>
</body></html>
